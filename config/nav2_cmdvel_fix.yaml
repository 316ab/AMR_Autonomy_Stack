velocity_smoother:
  ros__parameters:
    use_sim_time: true
    # Most Nav2 setups: smoother subscribes to raw cmd and publishes smoothed cmd
    # We force the smoothed output to be /cmd_vel
    cmd_vel_out_topic: /cmd_vel
    cmd_vel_in_topic: /cmd_vel_nav

controller_server:
  ros__parameters:
    use_sim_time: true
    # Make controller publish into the smoother input
    cmd_vel_topic: /cmd_vel_nav

